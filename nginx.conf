server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers; wasm-unsafe-eval lets the mesher's WebAssembly compile
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets; no add_header here, as it would drop the security headers above
    location ~* \.(?:ico|css|js|wasm|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
    }
}
